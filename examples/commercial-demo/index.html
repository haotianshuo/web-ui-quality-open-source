<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar CRM</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="alpha9-quality.css"></head>
<body><div class="app"><aside class="nav"><div class="logo">N</div><nav aria-label="Main navigation"><a class="active" aria-label="Customers" href="#customers"><span class="nav-short" aria-hidden="true">C</span><span class="nav-label">Customers</span></a><a aria-label="Pipeline" href="#pipeline"><span class="nav-short" aria-hidden="true">P</span><span class="nav-label">Pipeline</span></a><a aria-label="Tasks" href="#tasks"><span class="nav-short" aria-hidden="true">T</span><span class="nav-label">Tasks</span></a><a aria-label="Reports" href="#reports"><span class="nav-short" aria-hidden="true">R</span><span class="nav-label">Reports</span></a></nav><button class="profile">LA <span>Leo Allen</span></button></aside>
<main><header class="page-head"><div><p>Customer operations</p><h1>Accounts</h1></div><button class="primary" id="newAccount">New account</button></header><section class="toolbar"><label><span>Search accounts</span><input id="search" type="search" placeholder="Company, owner, or email"></label><div class="filters" role="group" aria-label="Account status"><button class="selected" data-filter="all">All</button><button data-filter="active">Active</button><button data-filter="risk">At risk</button></div></section>
<section class="workspace"><div class="list-panel"><div class="list-head"><b id="resultCount">4 accounts</b><button id="sort">Last activity ↓</button></div><div id="accounts" class="accounts" role="listbox" aria-label="Accounts" data-wuq-state-list></div><div class="empty" id="empty" data-wuq-empty-state hidden><b>No matching accounts</b><span>Try another search or clear the current filter.</span><button id="clear">Clear filters</button></div></div><article class="detail" id="detail" aria-live="polite"></article></section></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
