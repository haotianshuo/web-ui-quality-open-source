name: Public tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "pytest>=8,<10" "Pillow>=10,<13" "tomli; python_version < '3.11'"
      - name: Run public tests
        run: python -B run_tests.py
