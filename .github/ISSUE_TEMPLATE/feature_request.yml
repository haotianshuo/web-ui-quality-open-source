name: Feature request
description: Suggest a focused improvement for the public source preview
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe one focused change. Do not include private project data or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or workflow limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and its boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: What alternatives did you consider, and what would this change not do?
    validations:
      required: true

